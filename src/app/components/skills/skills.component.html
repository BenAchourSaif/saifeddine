<section id="skills">
  <div class="container">
    <p class="section-label">{{ ls.t().skills.label }}</p>
    <h2 class="section-title">{{ ls.t().skills.title }}</h2>
    <p class="section-subtitle">{{ ls.t().skills.subtitle }}</p>

    <div class="skills-grid">
      <div class="skill-category" *ngFor="let cat of ls.t().skills.categories">
        <div class="category-header">
          <span class="category-icon">{{ cat.icon }}</span>
          <h3 class="category-name">{{ cat.name }}</h3>
        </div>
        <div class="skill-pills">
          <div class="skill-pill" *ngFor="let skill of cat.skills">
            <span class="skill-name">{{ skill.name }}</span>
            <span class="skill-note" *ngIf="$any(skill).note">{{ $any(skill).note }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="languages-section">
      <h3 class="languages-title">{{ ls.t().skills.languagesLabel }}</h3>
      <div class="languages-list">
        <span class="tag" *ngFor="let lang of ls.t().skills.languages">{{ lang }}</span>
      </div>
    </div>
  </div>
</section>
